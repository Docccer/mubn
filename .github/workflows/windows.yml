name: Windows SSH Runner

on: [workflow_dispatch]

jobs:
  windows-runner:
    runs-on: windows-latest
    timeout-minutes: 1440

    steps:
      - name: Configure runneradmin account
        shell: powershell
        run: |
          if (Get-LocalUser -Name runneradmin -ErrorAction SilentlyContinue) {
            net user runneradmin "Aa@111111"
          } else {
            net user runneradmin "Aa@111111" /add
          }

      - name: Install and start OpenSSH Server
        shell: powershell
        run: |
          $capability = Get-WindowsCapability -Online -Name OpenSSH.Server* | Select-Object -First 1
          if ($capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $capability.Name
          }
          Start-Service sshd -ErrorAction SilentlyContinue
          Set-Service -Name sshd -StartupType Automatic

      - name: Set default SSH shell to PowerShell
        shell: powershell
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\OpenSSH' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell -Value 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' -PropertyType String -Force | Out-Null
          Restart-Service sshd -ErrorAction SilentlyContinue

      - name: Enable and optimize RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name 'DWMFRAMEINTERVAL' -Value 15 -PropertyType DWORD -Force
          $TSPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (!(Test-Path $TSPath)) {
            New-Item -Path $TSPath -Force | Out-Null
          }
          New-ItemProperty -Path $TSPath -Name 'VGPUEncoding' -Value 1 -PropertyType DWORD -Force
          New-ItemProperty -Path $TSPath -Name 'AVC444ModePreferred' -Value 1 -PropertyType DWORD -Force
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member runneradmin -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Restart-Service TermService -Force -ErrorAction SilentlyContinue

      - name: Write VPS private key
        shell: powershell
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.ssh" | Out-Null
          [System.IO.File]::WriteAllText("$env:USERPROFILE\.ssh\vps_key", $env:VPS_SSH_PRIVATE_KEY + "`n")
          $keyPath = "$env:USERPROFILE\.ssh\vps_key"
          $acl = Get-Acl -LiteralPath $keyPath
          $acl.SetAccessRuleProtection($true, $false)
          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($env:USERNAME, 'FullControl', 'Allow')
          $acl.AddAccessRule($rule)
          Set-Acl -LiteralPath $keyPath -AclObject $acl

      - name: Select free SSH and RDP tunnel ports
        shell: powershell
        run: |
          $sshPort = 0
          $rdpPort = 0
          for ($i = 0; $i -lt 300; $i++) {
            $port = Get-Random -Minimum 23000 -Maximum 25000
            $open = Test-NetConnection -ComputerName 20.243.210.171 -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue
            if (-not $open -and $port -ne $sshPort -and $port -ne $rdpPort) {
              if ($sshPort -eq 0) {
                $sshPort = $port
              } elseif ($rdpPort -eq 0) {
                $rdpPort = $port
              }
            }
            if ($sshPort -gt 0 -and $rdpPort -gt 0) {
              break
            }
          }
          if ($sshPort -lt 23000 -or $sshPort -gt 24999) {
            $sshPort = 23000
          }
          if ($rdpPort -lt 23000 -or $rdpPort -gt 24999) {
            $rdpPort = 23001
          }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "SELECTED_PORT=$sshPort`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "RDP_PORT=$rdpPort`n")

      - name: Start tunnel and keep runner alive
        shell: powershell
        env:
          CALLBACK_TOKEN: ${{ secrets.ACTIONS_CALLBACK_TOKEN }}
        run: |
          $sshPath = 'C:\Windows\System32\OpenSSH\ssh.exe'
          if (-not (Test-Path $sshPath)) {
            $sshPath = 'ssh.exe'
          }
          $arguments = @(
            '-i', "$env:USERPROFILE\.ssh\vps_key",
            '-o', 'StrictHostKeyChecking=no',
            '-o', 'ServerAliveInterval=30',
            '-o', 'ServerAliveCountMax=3',
            '-o', 'ExitOnForwardFailure=yes',
            '-N',
            '-R', "0.0.0.0:${env:SELECTED_PORT}:127.0.0.1:22",
            '-R', "0.0.0.0:${env:RDP_PORT}:127.0.0.1:3389",
            'tunnel@20.243.210.171'
          )
          $argString = ($arguments | ForEach-Object { '"' + $_.Replace('"', '\"') + '"' }) -join ' '
          $stdoutLog = Join-Path $env:TEMP 'ssh_tunnel.out'
          $stderrLog = Join-Path $env:TEMP 'ssh_tunnel.err'
          $process = Start-Process -FilePath $sshPath -ArgumentList $argString -WindowStyle Hidden -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            $stdout = if (Test-Path $stdoutLog) { Get-Content $stdoutLog -Raw } else { '' }
            $stderr = if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw } else { '' }
            Write-Error "Tunnel process exited with code $($process.ExitCode)"
            if ($stderr) { Write-Error $stderr }
            if ($stdout) { Write-Error $stdout }
            exit 1
          }

          Write-Output "PUBLIC_SSH_HOST=20.243.210.171"
          Write-Output "PUBLIC_SSH_PORT=$env:SELECTED_PORT"
          Write-Output "PUBLIC_SSH_USER=runneradmin"
          Write-Output "PUBLIC_SSH_PASSWORD=Aa@111111"
          Write-Output "PUBLIC_SSH_CMD=ssh -p $env:SELECTED_PORT runneradmin@20.243.210.171"
          Write-Output "PUBLIC_RDP_HOST=20.243.210.171"
          Write-Output "PUBLIC_RDP_PORT=$env:RDP_PORT"
          Write-Output "PUBLIC_RDP_USER=runneradmin"
          Write-Output "PUBLIC_RDP_PASSWORD=Aa@111111"
          Write-Output "PUBLIC_RDP_CMD=mstsc /v:20.243.210.171:$env:RDP_PORT"

          $payload = @{
            owner = 'Docccer'
            repo = 'mubn'
            workflow = 'windows.yml'
            runId = "$env:GITHUB_RUN_ID"
            jobName = 'windows-runner'
            runnerName = "$env:RUNNER_NAME"
            host = '20.243.210.171'
            port = "$env:SELECTED_PORT"
            user = 'runneradmin'
            password = 'Aa@111111'
            ssh = "ssh -p $env:SELECTED_PORT runneradmin@20.243.210.171"
            rdpHost = '20.243.210.171'
            rdpPort = "$env:RDP_PORT"
            rdpUser = 'runneradmin'
            rdpPassword = 'Aa@111111'
            rdp = "mstsc /v:20.243.210.171:$env:RDP_PORT"
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post -Uri 'http://20.243.210.171:2210/actions/tunnel-callback' -ContentType 'application/json' -Headers @{ 'X-Tunnel-Callback-Token' = "$env:CALLBACK_TOKEN" } -Body $payload | Out-Null
          } catch {
            Write-Warning "tunnel callback failed: $($_.Exception.Message)"
          }

          Start-Sleep -Seconds 21600

name: Windows SSH Runner (Codex Migrate)

on:
  workflow_dispatch:
    inputs:
      prev_run_id:
        description: '源 run id（还原该 run 的快照；留空=全新 runner）'
        required: false
        default: ''
      swap_hours:
        description: '换机周期（小时）'
        required: false
        default: '5'

jobs:
  windows-runner:
    runs-on: windows-latest
    timeout-minutes: 1440
    steps:
      - name: Configure runneradmin account
        shell: powershell
        run: |
          if (Get-LocalUser -Name runneradmin -ErrorAction SilentlyContinue) {
            net user runneradmin "Aa@111111"
          } else {
            net user runneradmin "Aa@111111" /add
          }

      - name: Install and start OpenSSH Server
        shell: powershell
        run: |
          $capability = Get-WindowsCapability -Online -Name OpenSSH.Server* | Select-Object -First 1
          if ($capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $capability.Name
          }
          Start-Service sshd -ErrorAction SilentlyContinue
          Set-Service -Name sshd -StartupType Automatic

      - name: Set default SSH shell to PowerShell
        shell: powershell
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\OpenSSH' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell -Value 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' -PropertyType String -Force | Out-Null
          Restart-Service sshd -ErrorAction SilentlyContinue

      - name: Enable and optimize RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name 'DWMFRAMEINTERVAL' -Value 15 -PropertyType DWORD -Force
          $TSPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (!(Test-Path $TSPath)) {
            New-Item -Path $TSPath -Force | Out-Null
          }
          New-ItemProperty -Path $TSPath -Name 'VGPUEncoding' -Value 1 -PropertyType DWORD -Force
          New-ItemProperty -Path $TSPath -Name 'AVC444ModePreferred' -Value 1 -PropertyType DWORD -Force
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member runneradmin -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Restart-Service TermService -Force -ErrorAction SilentlyContinue

      - name: Write VPS private key
        shell: powershell
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.ssh" | Out-Null
          [System.IO.File]::WriteAllText("$env:USERPROFILE\.ssh\vps_key", $env:VPS_SSH_PRIVATE_KEY + "`n")
          $keyPath = "$env:USERPROFILE\.ssh\vps_key"
          $acl = Get-Acl -LiteralPath $keyPath
          $acl.SetAccessRuleProtection($true, $false)
          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($env:USERNAME, 'FullControl', 'Allow')
          $acl.AddAccessRule($rule)
          Set-Acl -LiteralPath $keyPath -AclObject $acl

      - name: Select free SSH and RDP tunnel ports
        shell: powershell
        run: |
          $sshPort = 0
          $rdpPort = 0
          for ($i = 0; $i -lt 300; $i++) {
            $port = Get-Random -Minimum 23000 -Maximum 25000
            $open = Test-NetConnection -ComputerName 20.243.210.171 -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue
            if (-not $open -and $port -ne $sshPort -and $port -ne $rdpPort) {
              if ($sshPort -eq 0) { $sshPort = $port }
              elseif ($rdpPort -eq 0) { $rdpPort = $port }
            }
            if ($sshPort -gt 0 -and $rdpPort -gt 0) { break }
          }
          if ($sshPort -lt 23000 -or $sshPort -gt 24999) { $sshPort = 23000 }
          if ($rdpPort -lt 23000 -or $rdpPort -gt 24999) { $rdpPort = 23001 }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "SELECTED_PORT=$sshPort`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "RDP_PORT=$rdpPort`n")

      - name: Start tunnel and register callback
        shell: powershell
        env:
          CALLBACK_TOKEN: ${{ secrets.ACTIONS_CALLBACK_TOKEN }}
        run: |
          $sshPath = 'C:\Windows\System32\OpenSSH\ssh.exe'
          if (-not (Test-Path $sshPath)) { $sshPath = 'ssh.exe' }
          $arguments = @(
            '-i', "$env:USERPROFILE\.ssh\vps_key",
            '-o', 'StrictHostKeyChecking=no',
            '-o', 'ServerAliveInterval=30',
            '-o', 'ServerAliveCountMax=3',
            '-N',
            '-R', "0.0.0.0:${env:SELECTED_PORT}:127.0.0.1:22",
            '-R', "0.0.0.0:${env:RDP_PORT}:127.0.0.1:3389",
            'tunnel@20.243.210.171'
          )
          $argString = ($arguments | ForEach-Object { '"' + $_.Replace('"', '\"') + '"' }) -join ' '
          New-Item -ItemType Directory -Force 'D:\_mig' | Out-Null
          $supPath = 'D:\_mig\tunnel_supervisor.ps1'
          $supLines = @(
            '$ErrorActionPreference = ''SilentlyContinue''',
            '$existing = Get-CimInstance Win32_Process -Filter "Name=''ssh.exe''" | Where-Object { $_.CommandLine -like ''*tunnel@20.243.210.171*'' }',
            'if (-not $existing) {',
            "  Start-Process -FilePath '$sshPath' -ArgumentList '$argString' -WindowStyle Hidden",
            '}'
          )
          $sup = $supLines -join "`n"
          Set-Content -Path $supPath -Value $sup -Encoding UTF8
          schtasks /Create /TN codex-tunnel /TR "powershell -NoProfile -ExecutionPolicy Bypass -File D:\_mig\tunnel_supervisor.ps1" /SC MINUTE /MO 1 /RU runneradmin /RP 'Aa@111111' /RL HIGHEST /F | Out-Null
          schtasks /Run /TN codex-tunnel | Out-Null
          Start-Sleep -Seconds 6
          $alive = Get-CimInstance Win32_Process -Filter "Name='ssh.exe'" | Where-Object { $_.CommandLine -like '*tunnel@20.243.210.171*' }
          if ($alive) {
            Write-Output "tunnel alive pid=$($alive[0].ProcessId)"
          } else {
            Write-Warning "tunnel not alive yet; supervisor will retry every minute"
          }
          Write-Output "PUBLIC_SSH_HOST=20.243.210.171"
          Write-Output "PUBLIC_SSH_PORT=$env:SELECTED_PORT"
          Write-Output "PUBLIC_SSH_USER=runneradmin"
          Write-Output "PUBLIC_SSH_PASSWORD=Aa@111111"
          Write-Output "PUBLIC_SSH_CMD=ssh -p $env:SELECTED_PORT runneradmin@20.243.210.171"
          Write-Output "PUBLIC_RDP_HOST=20.243.210.171"
          Write-Output "PUBLIC_RDP_PORT=$env:RDP_PORT"
          Write-Output "PUBLIC_RDP_USER=runneradmin"
          Write-Output "PUBLIC_RDP_PASSWORD=Aa@111111"
          Write-Output "PUBLIC_RDP_CMD=mstsc /v:20.243.210.171:$env:RDP_PORT"

          $payload = @{
            owner = 'Docccer'
            repo = 'mubn'
            workflow = 'windows.yml'
            runId = "$env:GITHUB_RUN_ID"
            jobName = 'windows-runner'
            runnerName = "$env:RUNNER_NAME"
            host = '20.243.210.171'
            port = "$env:SELECTED_PORT"
            user = 'runneradmin'
            password = 'Aa@111111'
            ssh = "ssh -p $env:SELECTED_PORT runneradmin@20.243.210.171"
            rdpHost = '20.243.210.171'
            rdpPort = "$env:RDP_PORT"
            rdpUser = 'runneradmin'
            rdpPassword = 'Aa@111111'
            rdp = "mstsc /v:20.243.210.171:$env:RDP_PORT"
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post -Uri 'http://20.243.210.171:2210/actions/tunnel-callback' -ContentType 'application/json' -Headers @{ 'X-Tunnel-Callback-Token' = "$env:CALLBACK_TOKEN" } -Body $payload | Out-Null
          } catch {
            Write-Warning "tunnel callback failed: $($_.Exception.Message)"
          }

      - name: Install Codex desktop (winget)
        shell: powershell
        run: |
          $w = winget install --id=9PLM9XGG6VKS --source=msstore --accept-package-agreements --accept-source-agreements
          Write-Output $w
          Start-Sleep -Seconds 3
          Get-Process -Name ChatGPT,codex -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: Download bootstrap release
        if: ${{ inputs.prev_run_id == 'bootstrap' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'D:\mig\restore\state' | Out-Null
          New-Item -ItemType Directory -Force 'D:\mig\restore\runtime' | Out-Null
          New-Item -ItemType Directory -Force 'D:\mig\restore\d' | Out-Null
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/Docccer/mubn/releases/tags/migrate-bootstrap'
          foreach ($a in $release.assets) {
            switch -Wildcard ($a.name) {
              'codex-state.tar.gz' {
                & curl.exe -L --fail -sS -o 'D:\mig\restore\state\codex-state.tar.gz' $a.browser_download_url
                Write-Output "loaded $($a.name)"
              }
              'runtime-part-*.dat' {
                & curl.exe -L --fail -sS -o "D:\mig\restore\runtime\$($a.name)" $a.browser_download_url
                Write-Output "loaded $($a.name)"
              }
              'migrate-d.tar.gz' {
                & curl.exe -L --fail -sS -o 'D:\mig\restore\d\migrate-d.tar.gz' $a.browser_download_url
                Write-Output "loaded $($a.name)"
              }
              default {
                Write-Output "skip asset $($a.name)"
              }
            }
          }
          Get-ChildItem 'D:\mig\restore\state','D:\mig\restore\runtime' -ErrorAction SilentlyContinue |
            Select-Object FullName,Length | Format-Table -AutoSize | Out-String | Write-Output

      - name: Download codex-state artifact
        if: ${{ inputs.prev_run_id != '' && inputs.prev_run_id != 'bootstrap' }}
        uses: actions/download-artifact@v8
        with:
          pattern: codex-state
          run-id: ${{ inputs.prev_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: D:\mig\restore\state

      - name: Download codex-runtime artifact
        if: ${{ inputs.prev_run_id != '' && inputs.prev_run_id != 'bootstrap' }}
        uses: actions/download-artifact@v8
        with:
          pattern: codex-runtime-*
          run-id: ${{ inputs.prev_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: D:\mig\restore\runtime

      - name: Download migrate-d artifact
        if: ${{ inputs.prev_run_id != '' && inputs.prev_run_id != 'bootstrap' }}
        uses: actions/download-artifact@v8
        with:
          pattern: migrate-d
          run-id: ${{ inputs.prev_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: D:\mig\restore\d

      - name: Extract restored data
        if: ${{ inputs.prev_run_id != '' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process -Name ChatGPT,codex -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          # 1. .codex state
          $stateTar = 'D:\mig\restore\state\codex-state.tar.gz'
          if (Test-Path $stateTar) {
            tar -xzf $stateTar -C "$env:USERPROFILE"
            Write-Output "restored .codex"
          } else {
            Write-Warning "codex-state artifact missing"
          }

          # 2. codex runtime (concatenate parts in order)
          $rtDir = 'D:\mig\restore\runtime'
          $rtTar = 'D:\mig\restore\codex-runtime.tar.gz'
          $parts = Get-ChildItem "$rtDir\runtime-part-*.dat" -ErrorAction SilentlyContinue | Sort-Object Name
          if ($parts.Count -gt 0) {
            $outStream = [System.IO.File]::Create($rtTar)
            foreach ($p in $parts) {
              $inStream = [System.IO.File]::OpenRead($p.FullName)
              $inStream.CopyTo($outStream)
              $inStream.Close()
            }
            $outStream.Close()
            New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\OpenAI" | Out-Null
            tar -xzf $rtTar -C "$env:LOCALAPPDATA\OpenAI"
            Write-Output "restored codex runtime ($($parts.Count) parts)"
          } else {
            Write-Warning "codex-runtime artifact missing"
          }

          # 3. D: drive snapshot
          $dTar = 'D:\mig\restore\d\migrate-d.tar.gz'
          if (Test-Path $dTar) {
            tar -xzf $dTar -C 'D:\'
            Write-Output "restored D: snapshot"
          } else {
            Write-Warning "migrate-d artifact missing"
          }

          # 4. Ensure CODEX_CLI_PATH points at an existing native exe.
          $cfg = "$env:USERPROFILE\.codex\config.toml"
          if (Test-Path $cfg) {
            $m = Select-String -Path $cfg -Pattern "CODEX_CLI_PATH\s*=\s*'([^']+)'" | Select-Object -First 1
            if ($m) {
              $cli = $m.Matches[0].Groups[1].Value
              if (-not (Test-Path $cli)) {
                $wapp = Get-ChildItem 'C:\Program Files\WindowsApps\OpenAI.Codex_*' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($wapp) {
                  $res = Join-Path $wapp.FullName 'app\resources'
                  $binDir = Split-Path $cli -Parent
                  New-Item -ItemType Directory -Force -Path $binDir | Out-Null
                  foreach ($exe in @('codex.exe','codex-code-mode-host.exe','codex-command-runner.exe','codex-windows-sandbox-setup.exe','rg.exe')) {
                    $srcExe = Join-Path $res $exe
                    if (Test-Path $srcExe) { Copy-Item -Force $srcExe (Join-Path $binDir $exe) }
                  }
                  Write-Output "copied native exes to $binDir"
                }
              }
            }
          }

      - name: Report ready to orchestrator
        if: ${{ inputs.prev_run_id != '' }}
        shell: powershell
        env:
          CB_TOKEN: ${{ secrets.ACTIONS_CALLBACK_TOKEN }}
        run: |
          $body = @{ runId = "$env:GITHUB_RUN_ID"; ready = $true } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post -Uri 'http://20.243.210.171:2210/migrate/report' -ContentType 'application/json' -Headers @{ 'X-Tunnel-Callback-Token' = "$env:CB_TOKEN" } -Body $body -TimeoutSec 30 | Out-Null
            Write-Output "reported ready runId=$env:GITHUB_RUN_ID"
          } catch {
            Write-Warning "report ready failed: $($_.Exception.Message)"
          }

      - name: Wait for migration signal and snapshot
        id: prepare_snapshot
        shell: powershell
        env:
          CB_TOKEN: ${{ secrets.ACTIONS_CALLBACK_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $vps = 'http://20.243.210.171:2210'
          $runId = $env:GITHUB_RUN_ID
          $token = $env:CB_TOKEN
          Write-Output "waiting for snapshot signal (runId=$runId)"

          while ($true) {
            try {
              $r = Invoke-RestMethod "$vps/migrate/should_snapshot?runId=$runId" -Headers @{ 'X-Tunnel-Callback-Token' = $token } -TimeoutSec 20
              if ($r.snapshot -eq $true) { break }
            } catch {
              Write-Warning "should_snapshot poll error: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 15
          }
          Write-Output "snapshot signal received, stopping codex"

          Get-Process -Name ChatGPT,codex -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 8

          New-Item -ItemType Directory -Force -Path 'D:\_mig\upload' | Out-Null
          Remove-Item 'D:\_mig\upload\codex-state.tar.gz' -Force -ErrorAction SilentlyContinue
          Remove-Item 'D:\_mig\upload\codex-runtime.tar.gz' -Force -ErrorAction SilentlyContinue
          Remove-Item 'D:\_mig\upload\d.tar.gz' -Force -ErrorAction SilentlyContinue
          Get-ChildItem 'D:\_mig\upload\runtime-part-*.dat' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          tar -czf 'D:\_mig\upload\codex-state.tar.gz' -C "$env:USERPROFILE" .codex
          tar -czf 'D:\_mig\upload\codex-runtime.tar.gz' -C "$env:LOCALAPPDATA\OpenAI" Codex
          tar --exclude='D:/_mig' --exclude='D:/$RECYCLE.BIN' --exclude='D:/System Volume Information' --exclude='D:/pagefile.sys' --exclude='D:/DumpStack.log.tmp' --exclude='D:/DATALOSS_WARNING_README.txt' --exclude='D:/a/_temp' --exclude='D:/a/_PipelineMapping' --exclude='D:/CollectGuestLogsTemp' -czf 'D:\_mig\upload\d.tar.gz' -C 'D:\' .

          $chunkMB = 512; $chunkBytes = [int64]$chunkMB * 1MB
          $src = 'D:\_mig\upload\codex-runtime.tar.gz'
          $inFs = [System.IO.File]::OpenRead($src)
          $buf = New-Object byte[] (8MB)
          $part = 0; $written = [int64]0
          $outPath = ('D:\_mig\upload\runtime-part-{0}.dat' -f $part)
          $outFs = [System.IO.File]::Create($outPath)
          try {
            while ($true) {
              $n = $inFs.Read($buf, 0, $buf.Length)
              if ($n -le 0) { break }
              $outFs.Write($buf, 0, $n); $written += $n
              if ($written -ge $chunkBytes) {
                $outFs.Close(); $part++
                $outPath = ('D:\_mig\upload\runtime-part-{0}.dat' -f $part)
                $outFs = [System.IO.File]::Create($outPath); $written = 0
              }
            }
          } finally {
            $outFs.Close(); $inFs.Close()
          }
          Get-ChildItem 'D:\_mig\upload\runtime-part-*.dat' | Where-Object { $_.Length -eq 0 -and $_.Name -ne 'runtime-part-0.dat' } | ForEach-Object { Remove-Item $_.FullName -Force }

          $stateSize = (Get-Item 'D:\_mig\upload\codex-state.tar.gz').Length
          $dSize = (Get-Item 'D:\_mig\upload\d.tar.gz').Length
          $rtParts = Get-ChildItem 'D:\_mig\upload\runtime-part-*.dat' | Sort-Object Name
          $rtTotal = 0; foreach ($p in $rtParts) { $rtTotal += $p.Length }
          $total = [int64]$stateSize + [int64]$dSize + [int64]$rtTotal
          $manifest = @{ total = $total; state = [int64]$stateSize; d = [int64]$dSize; runtime = @($rtParts | ForEach-Object { [int64]$_.Length }) } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText('D:\_mig\upload\manifest.json', $manifest)

          $body = @{ runId = $runId; step = 'snapshot'; bytes_total = $total; bytes_done = 0 } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post -Uri "$vps/migrate/report" -Headers @{ 'X-Tunnel-Callback-Token' = $token } -ContentType 'application/json' -Body $body -TimeoutSec 30 | Out-Null
          } catch {
            Write-Warning "snapshot report failed: $($_.Exception.Message)"
          }
          Write-Output "SNAPSHOT_READY=true"
          echo "SNAPSHOT_READY=true" >> $env:GITHUB_OUTPUT

      - name: Upload codex-state
        if: steps.prepare_snapshot.outputs.SNAPSHOT_READY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-state
          path: D:\_mig\upload\codex-state.tar.gz
          compression-level: 0
          if-no-files-found: warn

      - name: Report state progress
        if: steps.prepare_snapshot.outputs.SNAPSHOT_READY == 'true'
        shell: powershell
        env:
          CB_TOKEN: ${{ secrets.ACTIONS_CALLBACK_TOKEN }}
        run: |
          $m = Get-Content 'D:\_mig\upload\manifest.json' | ConvertFrom-Json
          $done = [int64]$m.state
          $body = @{ runId = "$env:GITHUB_RUN_ID"; step = 'uploading'; bytes_total = [int64]$m.total; bytes_done = $done } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri 'http://20.243.210.171:2210/migrate/report' -Headers @{ 'X-Tunnel-Callback-Token' = "$env:CB_TOKEN" } -ContentType 'application/json' -Body $body -TimeoutSec 30 | Out-Null

      - name: Upload runtime part 0
        if: steps.prepare_snapshot.outputs.SNAPSHOT_READY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-runtime-0
          path: D:\_mig\upload\runtime-part-0.dat
          compression-level: 0
          if-no-files-found: warn

      - name: Report runtime progress 0
        if: steps.prepare_snapshot.outputs.SNAPSHOT_READY == 'true'
        shell: powershell
        env:
          CB_TOKEN: ${{ secrets.ACTIONS_CALLBACK_TOKEN }}
        run: |
          $m = Get-Content 'D:\_mig\upload\manifest.json' | ConvertFrom-Json
          $done = [int64]$m.state + [int64]$m.runtime[0]
          $body = @{ runId = "$env:GITHUB_RUN_ID"; step = 'uploading'; bytes_total = [int64]$m.total; bytes_done = $done } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri 'http://20.243.210.171:2210/migrate/report' -Headers @{ 'X-Tunnel-Callback-Token' = "$env:CB_TOKEN" } -ContentType 'application/json' -Body $body -TimeoutSec 30 | Out-Null

      - name: Upload runtime part 1
        if: steps.prepare_snapshot.outputs.SNAPSHOT_READY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-runtime-1
          path: D:\_mig\upload\runtime-part-1.dat
          compression-level: 0
          if-no-files-found: warn

      - name: Report runtime progress 1
        if: steps.prepare_snapshot.outputs.SNAPSHOT_READY == 'true'
        shell: powershell
        env:
          CB_TOKEN: ${{ secrets.ACTIONS_CALLBACK_TOKEN }}
        run: |
          $m = Get-Content 'D:\_mig\upload\manifest.json' | ConvertFrom-Json
          $done = [int64]$m.state + [int64]$m.runtime[0] + [int64]$m.runtime[1]
          $body = @{ runId = "$env:GITHUB_RUN_ID"; step = 'uploading'; bytes_total = [int64]$m.total; bytes_done = $done } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri 'http://20.243.210.171:2210/migrate/report' -Headers @{ 'X-Tunnel-Callback-Token' = "$env:CB_TOKEN" } -ContentType 'application/json' -Body $body -TimeoutSec 30 | Out-Null

      - name: Upload runtime part 2
        if: steps.prepare_snapshot.outputs.SNAPSHOT_READY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-runtime-2
          path: D:\_mig\upload\runtime-part-2.dat
          compression-level: 0
          if-no-files-found: warn

      - name: Report runtime progress 2
        if: steps.prepare_snapshot.outputs.SNAPSHOT_READY == 'true'
        shell: powershell
        env:
          CB_TOKEN: ${{ secrets.ACTIONS_CALLBACK_TOKEN }}
        run: |
          $m = Get-Content 'D:\_mig\upload\manifest.json' | ConvertFrom-Json
          $done = [int64]$m.state + [int64]$m.runtime[0] + [int64]$m.runtime[1] + [int64]$m.runtime[2]
          $body = @{ runId = "$env:GITHUB_RUN_ID"; step = 'uploading'; bytes_total = [int64]$m.total; bytes_done = $done } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri 'http://20.243.210.171:2210/migrate/report' -Headers @{ 'X-Tunnel-Callback-Token' = "$env:CB_TOKEN" } -ContentType 'application/json' -Body $body -TimeoutSec 30 | Out-Null

      - name: Upload runtime part 3
        if: steps.prepare_snapshot.outputs.SNAPSHOT_READY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-runtime-3
          path: D:\_mig\upload\runtime-part-3.dat
          compression-level: 0
          if-no-files-found: warn

      - name: Upload migrate-d
        if: steps.prepare_snapshot.outputs.SNAPSHOT_READY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: migrate-d
          path: D:\_mig\upload\d.tar.gz
          compression-level: 0
          if-no-files-found: warn

      - name: Report uploaded
        if: steps.prepare_snapshot.outputs.SNAPSHOT_READY == 'true'
        shell: powershell
        env:
          CB_TOKEN: ${{ secrets.ACTIONS_CALLBACK_TOKEN }}
        run: |
          $m = Get-Content 'D:\_mig\upload\manifest.json' | ConvertFrom-Json
          $body = @{ runId = "$env:GITHUB_RUN_ID"; step = 'uploaded'; bytes_total = [int64]$m.total; bytes_done = [int64]$m.total } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri 'http://20.243.210.171:2210/migrate/report' -Headers @{ 'X-Tunnel-Callback-Token' = "$env:CB_TOKEN" } -ContentType 'application/json' -Body $body -TimeoutSec 30 | Out-Null
          Write-Output "snapshot uploaded runId=$env:GITHUB_RUN_ID"

      - name: Keep runner alive until cancelled
        shell: powershell
        run: |
          Write-Output "keeping runner alive (will be cancelled by orchestrator after handoff)"
          while ($true) { Start-Sleep -Seconds 60 }
